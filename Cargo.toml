[workspace]
resolver = "2"
members = [
    "crates/azul-core",
    "crates/azul-search",
    "crates/azul-nnue",
    "crates/azul-az",
    "crates/azul-arena",
    "crates/azul-cli",
    "crates/azul-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
